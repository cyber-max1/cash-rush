name: Build Cash Rush APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Cash Rush projec
        run: |
            mkdir extracted
            unzip -q Cash_Rush_v2.1.2_ADS_FIXED.zip -d extracted
            echo "Extracted files:"
            find extracted -maxdepth 2 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: extracted/Cash_Rush_Monetized_v2_1
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cash-Rush-APK
          path: extracted/Cash_Rush_Monetized_v2_1/app/build/outputs/apk/debug/*.apk
