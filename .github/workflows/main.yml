name: Build Cash Rush RELEASE AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Cash Rush v2.2.0
        run: |
          mkdir -p extracted
          unzip -q "Cash_Rush_v2.2.0_RELEASE.zip" -d extracted
          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Enable BuildConfig
        run: |
          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          sed -i '/^[[:space:]]*android[[:space:]]*{/a\
              buildFeatures {\
                buildConfig true\
              }' "$APP_GRADLE"

      - name: Build RELEASE AAB
        run: |
          cd "$PROJECT_DIR"
          gradle :app:bundleRelease --stacktrace

      - name: Upload RELEASE AAB
        uses: actions/upload-artifact@v4
        with:
          name: Cash-Rush-v2.2.0-release-AAB
          path: '**/app/build/outputs/bundle/release/app-release.aab'
